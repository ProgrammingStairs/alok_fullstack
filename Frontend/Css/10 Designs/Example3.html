<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        #section{
            height: 280px;
        }
        #section img{
            height: 280px;
            width: 100%;
        }
        #user_section{
            height: 150px;
            width: 150px;
            margin-left: 60px;
            margin-top: -75px;
            border-radius: 50%;
            background-color: white;
        }
        #user_section img{
            height: 150px;
            width:150px;
            border-radius: 50%;
        }
        #search_section{
            height: 100px;
            width: 800px;
            padding: 50px;
            margin: auto;
            background-color: red;
        }
        input{
            height: 40px;
            width: 520px;
        }
        button{
            height: 45px;
            width: 240px;
            border-width: 0px;
        }
    </style>
</head>
<body>
    <div id="section">
        <img src="bannerImg.webp" alt="quotation image">
    </div>
    <div id="user_section">
        <img src="user.jpg" alt="user image">
    </div>
    <div id="search_section">
        <input type="text" placeholder="Search Destination">
        <button>Search Destination</button>
    </div>
</body>
</html>
