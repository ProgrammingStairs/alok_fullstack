<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                #section{
            height: 280px;
        }
        #section img{
            height: 280px;
            width: 100%;
        }
        #user_section{
            height: 150px;
            width: 150px;
            margin-left: 60px;
            margin-top: -75px;
            border-radius: 50%;
            background-color: white;
        }
        #user_section img{
            height: 150px;
            width:150px;
            border-radius: 50%;
        }

        .search-box {
            position: relative;
            width: 300px;
            margin-left: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            /* Left padding for the icon */
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 20%;
            font-size: 18px;
        }
    </style>
</head>

<body>
        <div id="section">
        <img src="bannerImg.webp" alt="quotation image">
    </div>
    <div id="user_section">
        <img src="user.jpg" alt="user image">
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search...">
    </div>
</body>

</html>
