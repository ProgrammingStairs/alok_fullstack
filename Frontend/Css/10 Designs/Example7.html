<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin-left: 50px;
            height: 30px;
            width: 260px;
            text-align: center;
            margin-top: 20px;
            background-color: brown;
            padding: 10px;
            font-size: 20px;
            font-family: candara;
            color:white;
        }
        div:hover{
            background-color: orange;
            border-radius: 10px;
            box-shadow: 1px 1px 20px 1px black;
            /* transform: scale(1.1); */
            /* transform: rotate(360deg); */
            /* transform: skew(-10deg,0deg); */
            transition: 1s;
            width:300px;
        }
    </style>
</head>
<body>
    <div>Home</div>
    <div>About</div>
    <div>Contact</div>
    <div>Services</div>
    <div>FAQ</div>
</body>
</html>
