<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            font-size: 50px;
            animation-name: animate;
            animation-duration: 1s;
            animation-iteration-count: 1;
        }
        @keyframes animate {
            from{
                color: white;
            }   
            to{
                color:red;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div>
        Discount | 25% OFF on ALL Items
    </div>
</body>
</html>
