<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            font-size: 50px;
            animation-name: animate;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes animate {
            0%{
                color: white;
            }   
            25%{
                color:red;
            }
            50%{
                color:orange;
            }
            75%{
                color:blue;
            }
            100%{
                color: purple;
            }
        }
    </style>
</head>
<body>
    <div>
        Discount | 25% OFF on ALL Items
    </div>
</body>
</html>
