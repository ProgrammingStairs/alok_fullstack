<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Universal selector */
        *{
            margin:0px;
        }
        /* Grouping selector */
        div,span{
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <div>This is div tag | Block level element</div>
    <div>This is div tag | Block level element</div>
    <span>This is span tag | Inline Element</span>
    <span>This is span tag | Inline Element</span>
</body>
</html>
