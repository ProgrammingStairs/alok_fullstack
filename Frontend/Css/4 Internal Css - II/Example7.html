<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* linear-gradient, radial-gradient is css3 properties */
        /* Element selector */
        div{
            height: 100px;
            width: 100px;
            float:left;
            border-color: black;
            border-width: 3px;
            border-style: solid;
            margin-left: 30px;
            margin-top: 30px;
        }
        /* Id selector */
        #demo1{
            border-radius: 5px;
            background-color: red;
        }
        #demo2{
            border-radius: 20px;
            background: linear-gradient(red,yellow);
        }
        #demo3{
            border-radius: 45px;
            background: linear-gradient(red,yellow,orange);
        }
        #demo4{
            border-radius: 50%;
            background: radial-gradient(yellow,orange);
            border-width: 0px;
            box-shadow: 1px 1px 40px 10px orange;
        }
        #demo5{
            border-radius: 20px 80px 40px 20px;
            background: repeating-radial-gradient(yellow 20%,red 40%);
        }
        #demo6{
            border-radius: 0% 100% 0% 0%;
            background: radial-gradient(yellow 20%,red 40%);
        }
        #demo7{
            border-radius: 0% 50% 50% 0%;
            background: linear-gradient(45deg,yellow 50%,red 50%);
        }
        #demo8{
            border-radius: 0% 100% 0% 100%;
            background: repeating-linear-gradient(red 10%,yellow 20%,orange 30%);
        }
        #demo9{
            border-radius: 50% 50% 50% 0%;
            background: repeating-linear-gradient(90deg,red 10%,yellow 20%,orange 30%);
        }
    </style>
</head>
<body>
    <div id="demo1"></div>
    <div id="demo2"></div>
    <div id="demo3"></div>
    <div id="demo4"></div>
    <div id="demo5"></div>
    <div id="demo6"></div>
    <div id="demo7"></div>
    <div id="demo8"></div>
    <div id="demo9"></div>
</body>
</html>
