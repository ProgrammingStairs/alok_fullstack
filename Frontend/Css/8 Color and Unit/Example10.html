<!-- 
    Units in CSS : 

    3. vh = viewport height and vw = viewport width
    device width = 1000px
    1vw = 1% of device width
        = 1/100 * 1000
        = 10px

    10vw = 10 x 10 = 100vw

    device height = 1000px
    1vh = 1% of device height
        = 1/100 * 1000
        = 10px

    6vh = 6 x 10 = 60vh

--> 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 92vw;
            border-style: solid;
            height: 92vh;
            font-size: 2.5vw;
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus, porro facilis molestias quaerat impedit fugit! Ducimus sapiente tenetur dolorum atque cum, unde nulla obcaecati consequuntur inventore perspiciatis iusto illo eligendi?</p>
    </div>    
</body>
</html>
