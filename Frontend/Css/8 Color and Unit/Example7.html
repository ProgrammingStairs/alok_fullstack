<!-- 
    Units in CSS : 

    1. px = pixel = picture element
        (fixed in size)

        parent div width = 500px
        child div width = 300px 
        
        if we modify parent width,

        parent div width = 200px
        child div width = 300px 
--> 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height:300px;
            /* width: 500px; */
            width: 200px;
            border-style: solid;
            padding: 20px;
        }
        #child{
            height:300px;
            width: 300px;
            border-style: solid;
        }
        
    </style>
</head>
<body>
    <div id="parent">
        <div id="child"></div>
    </div>
</body>
</html>
