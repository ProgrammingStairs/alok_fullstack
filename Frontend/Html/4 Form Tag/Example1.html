<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend align="center"><fieldset><b>Registration Form</b></fieldset></legend>
    <!-- <form method="get" action="welcome.html"> -->
    <form method="post" action="welcome.html">
    <table align="center">
        <tr>
            <td><label for="username">Username</label></td>
            <td>
                <input readonly value="John Deo" required type="text" placeholder="Enter Username" name="username" id="username">
            </td>
        </tr>   
        
        
        <tr>
            <td><label for="email">Email</label></td>
            <td>
                <input required type="email" placeholder="Enter Email" name="email" id="email">
            </td>
        </tr>     
        
        
        <tr>
            <td><label for="password">Pasword</label></td>
            <td>
                <input required type="password" placeholder="Enter Password" name="password" id="password">
            </td>
        </tr>  
        
        
        <tr>
            <td><label for="contact">Contact</label></td>
            <td>
                <input required type="text" pattern="[6789][0-9]{9}" maxlength="10" name="contact" placeholder="Enter 10-Digit Mobile Number" id="contact">
            </td>
        </tr>
        
        
        <tr>
            <td><label for="dob">DOB</label></td>
            <td>
                <input required type="date" id="dob" name="dob">
            </td>
        </tr>  
        
        
        <tr>
            <td><label for="male">Gender</label></td>
            <td>
                <input required checked type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </td>
        
        </tr>    
        
        
        <tr>
            <td><label for="cricket">Hobbies</label></td>
            <td>
                <input checked type="checkbox" name="cricket" id="cricket" value="cricket">
                <label for="cricket">Cricket</label>
                <input type="checkbox" name="football" id="football" value="football">
                <label for="football">Football</label>
            </td>
        </tr>    
        
        
        <tr>
            <td><label for="subject">Subject</label></td>
            <td>
                <select required name="subject" id="subject">
                <!-- <select required name="subject" id="subject" multiple> -->
                    <option value="">Select Subject</option>
                    <option value="C Language">C Language</option>
                    <option selected value="C++ Language">C++ Language</option>
                    <option value="C# Language">C# Language</option>
                    <option value="Java Language">Java Language</option>
                    <option value=".Net Language">.Net Language</option>
                </select>
            </td>
        </tr>


        <tr>
            <td><label for="address">Address</label></td>
            <td>
                <textarea required name="address" id="address" rows="3" cols="21" placeholder="Enter Address"></textarea>
            </td>
        </tr>


        <tr>
            <td><label for="file">Upload</label></td>
            <td>
                <input required type="file" name="file" id="file">
                <!-- <input required type="file" name="file" id="file" multiple> -->
            </td>
        </tr>


        <tr>
            <td></td>
            <td>
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </td>
        </tr>
        
    </table>
    </form>
    </fieldset>
</body>
</html>
