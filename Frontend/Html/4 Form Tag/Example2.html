<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="quantity">Number</label>
    <input type="number" min="0" max="100" step="0.5" placeholder="Enter Quantity" name="quantity" id="quantity">
    <br>
    <label for="color">Color</label>
    <input type="color" name="color" id="color">
    <br>
    <label for="time">Time</label>
    <input type="time" name="time" id="time">
    <br>
    <label for="month">Month</label>
    <input type="month" name="month" id="month">
    <br>
    <label for="week">Week</label>
    <input type="week" name="week" id="week">
    <br>
    <label for="date">Date</label>
    <input type="date" name="date" id="date">
    <br>
    <label for="status">Profile Completed</label>
    <progress value="75" max="100"></progress>
    <form action="welcome.html">
        <input type="url" required placeholder="http://www.google.com" name="url" id="url"> 
        <input type="submit">
    </form>
</body>
</html>
