<script>
   // Bitwise operator
   var a = 9, b = 10, c;
   c = a & b;
   document.write("<br>"+a+" & "+b+" = "+c);
   
   c = a | b;
   document.write("<br>"+a+" | "+b+" = "+c);
  
   c = a ^ b;
   document.write("<br>"+a+" ^ "+b+" = "+c);
   
   c = 4<<2;
   document.write("<br>4 << 2 = "+c);
   
   c = 4>>2;
   document.write("<br>4 >> 2 = "+c);
  
   c = ~a;
   document.write("<br>~"+a+" = "+c);
   

</script>
