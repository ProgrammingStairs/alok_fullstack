<script>
   // logical operator
   var c = (10>5 && 10<4) ? "statement 1" : "statement 2";
   document.write(c+"<br>");

   var c = (10>5 || 10<4) ? "statement 1" : "statement 2";
   document.write(c+"<br>");

   var c = !(10>5 && 10<4) ? "statement 1" : "statement 2";
   document.write(c+"<br>");

</script>
