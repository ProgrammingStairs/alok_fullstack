<script>
   "use strict"
   var x = 1;
   var y = 2;
   var z = 8;

   document.write("x : "+x);
   document.write("<br>y : "+y);
   document.write("<br>z : "+z);
   
   var total = x+y+z;
   document.write("<br>total : "+total);
   var avg = total/3;
   document.write("<br>average : "+avg);

   document.write("<br>average : "+avg.toPrecision(3));
   document.write("<br>average : "+avg.toFixed(3));
   
   document.write("<br>average : "+Math.ceil(avg));
   document.write("<br>average : "+Math.floor(avg));
   
</script>
