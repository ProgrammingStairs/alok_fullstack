<script>
   // arithmetic operator
   var a = 5, b = 2, c;
   c = a + b;
   document.write("<br>"+a+" + "+b+" = "+c);
   console.log(a+" + "+b+" = "+c);

   c = a - b;
   document.write("<br>"+a+" - "+b+" = "+c);
   console.log(a+" - "+b+" = "+c);

   c = a * b;
   document.write("<br>"+a+" * "+b+" = "+c);
   console.log(a+" * "+b+" = "+c);
   
   c = a / b;
   document.write("<br>"+a+" / "+b+" = "+c);
   console.log(a+" / "+b+" = "+c);

   c = a % b;
   document.write("<br>"+a+" % "+b+" = "+c);
   console.log(a+" % "+b+" = "+c);

   c = a ** b;
   document.write("<br>"+a+" ** "+b+" = "+c);
   console.log(a+" ** "+b+" = "+c);


</script>
