<script>
   // arithmetic assignment operator | shorthand operator | compound operator
   var a = 5, b = 2, c=2, d=5 ,e=3 ;
   
   a += 10;    // a = a + 10;
   document.write("<br>value of a = "+a);

   b -= 100;   // b = b - 100;
   document.write("<br> value of b = "+b);

    c *= 200;   // c = c * 100;
   document.write("<br> value of c = "+c);

    d /= 10;   // d = d * 100;
   document.write("<br> value of d = "+d);

    e %= 20;   // e = e * 100;
   document.write("<br> value of e = "+e);


</script>
