<script>
   // conditional operator (ternary operator)
   // (condition) ? (expression 1) : (expression 2);
   var a = 5, b = 2, c ;
   c = a>b ? a : b;
   document.write("Greater Number : "+c);

   var a = 15, b = 22, c=87 , d ;
   d = (a>b) ? ( a>c ? a : c ) : ( b>c ? b : c );
   document.write("<br>Greater Number : "+d);

</script>
