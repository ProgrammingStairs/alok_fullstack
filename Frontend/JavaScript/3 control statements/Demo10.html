<script>
    // example showing the concept of switch control statement
    var num = 10,i=1;
    switch(i++){
        case -3: num--;
                break;
        case 1 : num++; // 10--->11
        case 4 : --num; // 10
        case 0 : --num; // 9
        default : alert("num : "+ ++num); // 10
                    break;
    }
    
</script>
