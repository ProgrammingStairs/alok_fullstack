<script>
    // example to find grade using nested if else statement
    
    var m1=parseInt(prompt("Enter marks of 1st subject : "));
    var m2=parseInt(prompt("Enter marks of 2nd subject : "));
    var m3=parseInt(prompt("Enter marks of 3rd subject : "));
    var m4=parseInt(prompt("Enter marks of 4th subject : "));
    var m5=parseInt(prompt("Enter marks of 5th subject : "));

    var total = m1+m2+m3+m4+m5;
    // alert(total);
    var per = total/5;
    alert("Percentage : "+per);
    if(per>=75 && per<=100)
        document.write("Grade A");
    else{
        if(per>=60 && per<75)
            document.write("Grade B");
        else{
            if(per>=50 && per<60)
                document.write("Grade C");
            else{
                if(per>=33 && per<50)
                    document.write("Grade D");
                else
                    document.write("Fail");
            }
        }
    }
</script>
