<script>
        // example showing the concept of switch control statement

    var color = prompt("Enter color : ");
    switch(color){
        case "red" : alert("You selected red color");
                    break;
        case "red" : alert("You selected red color.....");
                    break;
        case "green" : alert("You selected green color");
                    break;
        default : alert("Invalid selection");
                    break;
    }
    
</script>
