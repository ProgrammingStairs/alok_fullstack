<script>
    var size = parseInt(prompt("Enter size : "));
    alert("Click Ok to take array elements : ");
    var arr=[]
    for(i=0;i<size;i++)
        arr[i]=parseInt(prompt("Enter array element "));
    
    document.write("Array elements are : ");
    var min = arr[0];
    var max = arr[0];
    for(i=0;i<arr.length;i++){
        if(min>arr[i])
            min = arr[i];
        if(max<arr[i])
            max = arr[i];
        document.write(arr[i]+" ");
    }
document.write("<br>Minimum element : "+min);
document.write("<br>Maximum element : "+max);

</script>
