<script>
    function myFun(){
        var obj1 = {
            name : "andrew",
            salary: 3400,
            address:{
                state:"Madhya Pradesh",
                city:"Indore",
                pincode:452010
            }
        }
        var obj2 = {
            name : "jack",
            salary: 2200,
            address:{
                state:"Madhya Pradesh",
                city:"Indore",
                pincode:452010
            }
        }
        var obj3 = {
            name : "Jacob",
            salary: 7888,
            address:{
                state:"Madhya Pradesh",
                city:"Indore",
                pincode:452010
            }
        }
        var arr = [obj1,obj2,obj3];

        var table="<table border='1' cellspacing='0' cellpadding='7'><tr><th rowspan='2'>S.No</th><th rowspan='2'>Name</th><th rowspan='2'>Salary</th><th colspan='3'>Address</th><tr><th>State</th><th>City</th><th>Pincode</th></tr>"
        for(i=0;i<arr.length;i++){
            table += "<tr><td>"+(i+1)+"</td><td>"+arr[i].name+"</td><td>"+arr[i].salary+"</td><td>"+arr[i].address.state+"</td><td>"+arr[i].address.city+"</td><td>"+arr[i].address.pincode+"</td></tr>";
        }
        table += "</table>";
        document.getElementById('show').innerHTML=table;
    }
</script>
<button onClick="myFun()">Show Data</button>
<p id="show"></p>
