<script>
    var fullName = "Full Name";
    var obj={
        let : 101,
        return : "andrew",
        for : true,
        0 : undefined,
        fullName:"Jack Jackson",
        "My Name":"Gaurav Kothari"
    }

    document.write("<br>typeof obj.let : "+typeof obj.let);
    document.write("<br>obj['let'] : "+obj["let"]);
    document.write("<br>obj[0] : "+obj[0]);
    
    document.write("<br>typeof obj.return : "+typeof obj.return);
    document.write("<br>typeof obj.for : "+typeof obj.for);
    document.write("<br>typeof obj['0'] : "+typeof obj["0"]);
    document.write("<br>typeof obj['Full Name'] : "+typeof obj.fullName);
    document.write("<br>typeof obj['My Name'] : "+typeof obj["My Name"]);

    for(var key in obj){
        document.write("<br>typeof "+key+" : "+typeof key);
    }
</script>
