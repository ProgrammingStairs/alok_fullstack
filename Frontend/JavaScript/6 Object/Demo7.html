<script>
    var obj1 = {
        name : "andrew",
        salary: 3400
    }
    var obj2 = {
        name : "jack",
        salary: 2200
    }
    var obj3 = {
        name : "Jacob",
        salary: 7888
    }
    var arr = [obj1,obj2,obj3];

    var table="<table border='1' cellspacing='0' cellpadding='7'><tr><th>S.No</th><th>Name</th><th>Salary</th></tr>"
    for(i=0;i<arr.length;i++){
        table += "<tr><td>"+(i+1)+"</td><td>"+arr[i].name+"</td><td>"+arr[i].salary+"</td></tr>";
    }
    table += "</table>";
    document.write(table);
</script>
