<!-- spread operator -->
 <script>
        // with spread operator
    var car1 = ["nano","punch","magnite","sierria"];
    var car2 = ["verna","kia","sirrea"];
    var car3 = [...car1,...car2,"kalyaq"];

    document.write("<br><br>car1 : "+car1);
    document.write("<br>car2 : "+car2);
    document.write("<br>car3 : "+car3);

    var name = "Andrew";
    var ch = [...name];
    document.write("<br>"+ch);
 </script>
