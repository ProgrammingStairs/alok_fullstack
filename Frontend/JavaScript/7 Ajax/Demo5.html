<!-- Array destructuring and rest parameter -->
 <script>
    // array destructuring
    var [car1,car2,...car3] = ["nano","punch","magnite","sierria"];
    // ...car3 shows rest parameter
    
    document.write("<br><br>car1 : "+car1);
    document.write("<br>car2 : "+car2);
    document.write("<br>car3 : "+car3);

     </script>
